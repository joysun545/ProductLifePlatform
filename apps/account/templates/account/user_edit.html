<!-- apps/account/templates/account/user_edit.html -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>编辑用户 - {{ user.name|default:user.wx_nickname|default:"用户" }}</title>

    <style>
        body{
            font-family:"Microsoft YaHei",Arial,sans-serif;
            background:#f5f5f5;
            margin:0;
            padding:30px;
        }

        .card{
            max-width:900px;
            margin:0 auto;
            background:#fff;
            border-radius:8px;
            padding:30px;
            box-shadow:0 2px 8px rgba(0,0,0,.08);
        }

        h2{
            margin-top:0;
            margin-bottom:30px;
        }

        h3{
            margin-top:35px;
            margin-bottom:20px;
            padding-bottom:8px;
            border-bottom:1px solid #e5e5e5;
            color:#444;
            font-size:18px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
            color:#333;
        }

        input,
        select{
            width:100%;
            padding:10px;
            border:1px solid #ddd;
            border-radius:4px;
            box-sizing:border-box;
            font-size:14px;
        }

        input[readonly]{
            background:#f7f7f7;
            color:#666;
            cursor:not-allowed;
        }

        .avatar{
            width:80px;
            height:80px;
            border-radius:50%;
            border:1px solid #ddd;
            object-fit:cover;
            display:block;
            margin-bottom:10px;
        }

        .btn-area{
            margin-top:40px;
        }

        .btn-back{
            display:inline-block;
            background:#6c757d;
            color:#fff;
            text-decoration:none;
            padding:12px 24px;
            border-radius:4px;
            margin-right:10px;
        }

        button{
            background:#05c46b;
            color:#fff;
            border:none;
            padding:12px 24px;
            border-radius:4px;
            cursor:pointer;
            font-size:15px;
        }

        button:hover{
            background:#04b15f;
        }

        .readonly-tip{
            color:#999;
            font-size:13px;
            margin-top:-8px;
            margin-bottom:18px;
        }
    </style>

</head>

<body>

<div class="card">

    <h2>编辑用户资料</h2>

    <form method="post">

        {% csrf_token %}

        <!-- ======================== -->
        <!-- 基本信息 -->
        <!-- ======================== -->

        <h3>基本信息</h3>

        <div class="form-group">
            <label>姓名</label>
            <input
                    type="text"
                    name="name"
                    value="{{ user.name }}">
        </div>

        <div class="form-group">
            <label>手机号</label>
            <input
                    type="text"
                    name="phone"
                    value="{{ user.phone }}">
        </div>

        <div class="form-group">
            <label>所在区域</label>
            <input
                    type="text"
                    name="region"
                    value="{{ user.region }}">
        </div>

        <!-- ======================== -->
        <!-- 微信信息 -->
        <!-- ======================== -->

        <h3>微信信息</h3>

        <div class="readonly-tip">
            以下信息由微信授权获取，仅供查看，不允许后台修改。
        </div>

        <div class="form-group">
            <label>微信昵称</label>
            <input
                    type="text"
                    value="{{ user.wx_nickname }}"
                    readonly>
        </div>

        <div class="form-group">
            <label>OpenID</label>
            <input
                    type="text"
                    value="{{ user.wx_openid }}"
                    readonly>
        </div>

        <div class="form-group">
            <label>UnionID</label>
            <input
                    type="text"
                    value="{{ user.wx_unionid }}"
                    readonly>
        </div>

        <div class="form-group">

            <label>微信头像</label>

            {% if user.wx_avatar %}
                <img
                        src="{{ user.wx_avatar }}"
                        class="avatar">
            {% endif %}

            <input
                    type="text"
                    value="{{ user.wx_avatar }}"
                    readonly>

        </div>

        <!-- ======================== -->
        <!-- 组织与权限 -->
        <!-- ======================== -->

        <h3>组织与权限</h3>

        <div class="form-group">

            <label>所属组织</label>

            <select name="organization">

                <option value="">--请选择组织--</option>

                {% for org in organizations %}

                    <option
                            value="{{ org.id }}"
                            {% if user.organization_id == org.id %}selected{% endif %}>

                        {{ org.name }}

                    </option>

                {% endfor %}

            </select>

        </div>

        <div class="form-group">

            <label>角色</label>

            <select name="role">

                {% for value,label in role_choices %}

                    <option
                            value="{{ value }}"
                            {% if user.role == value %}selected{% endif %}>

                        {{ label }}

                    </option>

                {% endfor %}

            </select>

        </div>

        <div class="form-group">

            <label>上级用户</label>

            <select name="parent_user">

                <option value="">无</option>

                {% for u in users %}

                    <option
                            value="{{ u.id }}"
                            {% if user.parent_user_id == u.id %}selected{% endif %}>

                        {{ u.name|default:u.wx_nickname }}

                    </option>

                {% endfor %}

            </select>

        </div>

        <div class="form-group">

            <label>属主用户</label>

            <select name="owner_user">

                <option value="">无</option>

                {% for u in users %}

                    <option
                            value="{{ u.id }}"
                            {% if user.owner_user_id == u.id %}selected{% endif %}>

                        {{ u.name|default:u.wx_nickname }}

                    </option>

                {% endfor %}

            </select>

        </div>

        <div class="form-group">

            <label>属主类型</label>

            <select name="owner_type">

                <option value="">--请选择--</option>

                {% for value,label in owner_type_choices %}

                    <option
                            value="{{ value }}"
                            {% if user.owner_type == value %}selected{% endif %}>

                        {{ label }}

                    </option>

                {% endfor %}

            </select>

        </div>

        <!-- ======================== -->
        <!-- 系统信息 -->
        <!-- ======================== -->

        <h3>系统信息</h3>

        <div class="form-group">
            <label>注册时间</label>
            <input
                    type="text"
                    value="{{ user.date_joined|date:'Y-m-d H:i:s' }}"
                    readonly>
        </div>

        <div class="form-group">
            <label>最后登录</label>
            <input
                    type="text"
                    value="{{ user.last_login|date:'Y-m-d H:i:s' }}"
                    readonly>
        </div>

        <div class="form-group">
            <label>是否启用</label>
            <input
                    type="text"
                    value="{% if user.is_active %}是{% else %}否{% endif %}"
                    readonly>
        </div>

        <div class="form-group">
            <label>是否员工</label>
            <input
                    type="text"
                    value="{% if user.is_staff %}是{% else %}否{% endif %}"
                    readonly>
        </div>

        <div class="form-group">
            <label>超级管理员</label>
            <input
                    type="text"
                    value="{% if user.is_superuser %}是{% else %}否{% endif %}"
                    readonly>
        </div>

        <div class="btn-area">

            <a
                    href="{% url 'pldp:web:account:user_manage' %}"
                    class="btn-back">

                返回列表

            </a>

            <button type="submit">

                保存修改

            </button>

        </div>

    </form>

</div>

</body>
</html>
