<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>打印中心扫码登录</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:32px 16px;background:#f4f7f6;color:#17251f;font-family:"Microsoft YaHei",Arial,sans-serif}.panel{max-width:560px;margin:5vh auto;padding:32px;background:#fff;border-radius:16px;text-align:center;box-shadow:0 5px 20px #0001}h1{font-size:24px}p{line-height:1.8;color:#55665e}#login-qr{width:260px;max-width:100%;image-rendering:pixelated}button{border:0;border-radius:8px;padding:12px 24px;background:#07a958;color:white;font-size:16px;cursor:pointer}button:disabled{opacity:.5}#status{min-height:28px;color:#35634e}.foot{font-size:13px}
  </style>
<style>
html{height:100%;scroll-padding-top:0}body.pldp-web-page{margin:0!important;padding:0!important;height:100dvh!important;overflow:hidden!important;background:#f5f7f2!important;color:#152e2a;font-family:'Segoe UI','Microsoft YaHei',sans-serif}
.pldp-site-header,.pldp-site-header *{box-sizing:border-box}.pldp-site-header{position:relative!important;z-index:100!important;height:72px!important;min-height:72px;display:flex!important;align-items:center;justify-content:space-between;padding:0 5%!important;margin:0!important;width:100%;max-width:none!important;background:#f5f7f2!important;color:#152e2a!important;border-bottom:1px solid #dfe7e2;box-shadow:none!important;border-radius:0!important}
.pldp-brand{display:flex;align-items:center;gap:13px;text-decoration:none!important;color:#152e2a!important}.pldp-brand>b{background:#006d57;color:white;border-radius:12px;padding:7px 13px;font-size:23px;line-height:1.7}.pldp-brand span{font-size:21px;font-weight:700;line-height:1.3}.pldp-brand small{display:block;font-size:10px;font-weight:400;letter-spacing:2px;margin-top:4px}.pldp-site-header nav{display:flex;align-items:center;gap:30px;font:13px/1.7 'Segoe UI','Microsoft YaHei',sans-serif}.pldp-site-header nav a{color:#152e2a;text-decoration:none}.pldp-site-header .pldp-entry,.pldp-site-header button{width:auto!important;margin:0!important;background:#e7eddf!important;color:#006d57!important;border:1px solid #c4d9c9!important;border-radius:20px!important;padding:6px 13px!important;font:12px/1.7 inherit;cursor:pointer}
.pldp-page-frame{box-sizing:border-box;height:calc(100dvh - 72px);display:flex;flex-direction:column;min-height:0;padding:20px clamp(18px,3vw,56px) 24px;gap:16px}.pldp-page-heading{flex:none;margin:0!important;padding:0!important;font-size:24px!important;line-height:1.4!important;letter-spacing:0!important;color:#152e2a!important}.pldp-page-content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:24px;background:white;border:1px solid #dfe7e2;border-radius:14px}
.pldp-page-content>main,.pldp-page-content>.container,.pldp-page-content>.wrap{width:100%!important;max-width:none!important;margin:0!important;padding:0!important}.pldp-page-content>main.card{box-shadow:none;border:0;background:transparent}.pldp-page-content .pldp-old-heading{display:none!important}.pldp-page-content>header{height:auto;position:static;background:transparent;color:inherit;margin:0 0 18px;padding:0;border:0}.pldp-page-content .header{box-shadow:none;border-radius:0;padding:0 0 16px}.pldp-page-content table{max-width:100%}.pldp-page-content .grid{margin-top:16px}
@media(max-width:700px){.pldp-site-header{padding-inline:16px!important}.pldp-site-header nav{gap:10px}.pldp-site-header nav>a:not(.pldp-entry){display:none}.pldp-brand small{font-size:8px;letter-spacing:0}.pldp-page-frame{padding:16px 12px;gap:12px}.pldp-page-content{padding:16px}.pldp-page-heading{font-size:20px!important}}
@media print{body.pldp-web-page{height:auto!important;overflow:visible!important;background:#fff!important}.pldp-site-header,.pldp-page-heading{display:none!important}.pldp-page-frame,.pldp-page-content{display:block!important;height:auto!important;overflow:visible!important;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important}.pldp-page-content>.container>:not(#result-panel){display:none!important}}
</style></head>
<body class="pldp-web-page"><header class="pldp-site-header"><a class="pldp-brand" href="/"><b>PL</b><span>PLDP<small>产品生命周期数字平台</small></span></a><nav><a href="/#explore">工作域演示</a><a href="/#principles">协同逻辑</a><a class="pldp-entry" href="/pldp/web/portal/">进入工作台</a><button type="button" id="pldp-shell-logout">退出登录</button></nav></header><div class="pldp-page-frame"><h1 class="pldp-page-heading">成品打印中心登录</h1><div class="pldp-page-content"><main class="panel">
  <h1 class="pldp-old-heading">PLDP V2 二维码打印中心</h1>
  <p>请厂家成品库管打开小程序，使用「扫一扫」扫描下方二维码，并在手机上确认登录。</p>
  <img id="login-qr" alt="打印中心登录二维码" hidden>
  <p id="status" role="status">正在获取二维码…</p>
  <button id="refresh">刷新登录二维码</button>
  <p class="foot">二维码 5 分钟内有效。登录后可在当前电脑处理本厂待打印批次，30 分钟后需重新扫码。</p>
</main>
<script>
  const START_URL="{% url 'pldp:web:print:login_start' %}",STATUS_URL="{% url 'pldp:web:print:login_status' %}";
  let timer=null,expiresAt=0,active=false;
  const csrf="{{ csrf_token|escapejs }}";
  async function post(url){const response=await fetch(url,{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"X-CSRFToken":csrf,"Content-Type":"application/json"},body:"{}"});let result;try{result=await response.json()}catch(e){throw new Error("请求失败，请刷新页面后重新扫码。")}if(!response.ok||result.code!==0)throw new Error(result.msg||"请求失败");return result.data}
  function stop(message){active=false;clearTimeout(timer);document.getElementById("login-qr").hidden=true;document.getElementById("status").textContent=message}
  async function poll(){if(!active)return;if(Date.now()>=expiresAt){stop("二维码已过期，请刷新登录二维码。");return}try{const data=await post(STATUS_URL);if(data.status==="ready"){active=false;window.location.replace("{% url 'pldp:web:print:center' %}");return}document.getElementById("status").textContent="等待手机扫码确认（剩余 "+Math.ceil((expiresAt-Date.now())/1000)+" 秒）"}catch(error){stop(error.message);return}timer=setTimeout(poll,2000)}
  async function start(){clearTimeout(timer);active=false;const button=document.getElementById("refresh");button.disabled=true;document.getElementById("login-qr").hidden=true;try{const data=await post(START_URL);const img=document.getElementById("login-qr");img.src=data.qr_image;img.hidden=false;expiresAt=Date.now()+data.expires_in*1000;active=true;document.getElementById("status").textContent="等待手机扫码确认…";timer=setTimeout(poll,2000)}catch(error){stop(error.message)}finally{button.disabled=false}}
  document.getElementById("refresh").onclick=start;
  window.addEventListener("pagehide",()=>{active=false;clearTimeout(timer)});
  window.addEventListener("pageshow",event=>{if(event.persisted)window.location.reload()});
  start();
</script></div></div><script>(function(){var b=document.getElementById('pldp-shell-logout');if(b)b.onclick=async function(){var c=document.cookie.split('; ').find(function(x){return x.startsWith('csrftoken=')});var t=c?decodeURIComponent(c.slice(10)):'';if(!t){var i=document.querySelector('[name=csrfmiddlewaretoken]');t=i?i.value:''}try{var r=await fetch('/pldp/web/portal/api/logout/',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':t}});if(!r.ok)throw Error();location.assign('/')}catch(e){alert('退出失败，请刷新页面后重试。')}}})();</script></body></html>
