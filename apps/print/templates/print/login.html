<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>打印中心扫码登录</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:32px 16px;background:#f4f7f6;color:#17251f;font-family:"Microsoft YaHei",Arial,sans-serif}.panel{max-width:560px;margin:5vh auto;padding:32px;background:#fff;border-radius:16px;text-align:center;box-shadow:0 5px 20px #0001}h1{font-size:24px}p{line-height:1.8;color:#55665e}#login-qr{width:260px;max-width:100%;image-rendering:pixelated}button{border:0;border-radius:8px;padding:12px 24px;background:#07a958;color:white;font-size:16px;cursor:pointer}button:disabled{opacity:.5}#status{min-height:28px;color:#35634e}.foot{font-size:13px}
  </style>
</head>
<body><main class="panel">
  <h1>PLDP V2 二维码打印中心</h1>
  <p>请厂家成品库管打开小程序，使用「扫一扫」扫描下方二维码，并在手机上确认登录。</p>
  <img id="login-qr" alt="打印中心登录二维码" hidden>
  <p id="status" role="status">正在获取二维码…</p>
  <button id="refresh">刷新登录二维码</button>
  <p class="foot">二维码 5 分钟内有效。登录后可在当前电脑处理本厂待打印批次，30 分钟后需重新扫码。</p>
</main>
<script>
  const START_URL="{% url 'pldp:web:print:login_start' %}",STATUS_URL="{% url 'pldp:web:print:login_status' %}";
  let timer=null,expiresAt=0,active=false;
  const csrf="{{ csrf_token|escapejs }}";
  async function post(url){const response=await fetch(url,{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"X-CSRFToken":csrf,"Content-Type":"application/json"},body:"{}"});let result;try{result=await response.json()}catch(e){throw new Error("请求失败，请刷新页面后重新扫码。")}if(!response.ok||result.code!==0)throw new Error(result.msg||"请求失败");return result.data}
  function stop(message){active=false;clearTimeout(timer);document.getElementById("login-qr").hidden=true;document.getElementById("status").textContent=message}
  async function poll(){if(!active)return;if(Date.now()>=expiresAt){stop("二维码已过期，请刷新登录二维码。");return}try{const data=await post(STATUS_URL);if(data.status==="ready"){active=false;window.location.replace("{% url 'pldp:web:print:center' %}");return}document.getElementById("status").textContent="等待手机扫码确认（剩余 "+Math.ceil((expiresAt-Date.now())/1000)+" 秒）"}catch(error){stop(error.message);return}timer=setTimeout(poll,2000)}
  async function start(){clearTimeout(timer);active=false;const button=document.getElementById("refresh");button.disabled=true;document.getElementById("login-qr").hidden=true;try{const data=await post(START_URL);const img=document.getElementById("login-qr");img.src=data.qr_image;img.hidden=false;expiresAt=Date.now()+data.expires_in*1000;active=true;document.getElementById("status").textContent="等待手机扫码确认…";timer=setTimeout(poll,2000)}catch(error){stop(error.message)}finally{button.disabled=false}}
  document.getElementById("refresh").onclick=start;
  window.addEventListener("pagehide",()=>{active=false;clearTimeout(timer)});
  window.addEventListener("pageshow",event=>{if(event.persisted)window.location.reload()});
  start();
</script></body></html>
