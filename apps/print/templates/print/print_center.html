<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PLDP 产品生命周期二维码打印中心</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:28px;background:#f4f7f6;color:#17251f;font-family:"Microsoft YaHei",Arial,sans-serif}.container{max-width:1180px;margin:auto}.header,.panel{background:#fff;border-radius:16px;box-shadow:0 5px 20px rgba(0,0,0,.06)}.header{padding:24px;margin-bottom:22px;text-align:center}.header h1{margin:0;font-size:25px}.panel{padding:24px;margin-bottom:22px}.panel-title{margin:0 0 18px;font-size:19px}label{display:block;margin:0 0 8px;font-weight:700}select{width:100%;min-height:44px;padding:10px 12px;border:1px solid #cfdad5;border-radius:8px;background:#fff;font-size:15px}.hint,.empty,.message{margin-top:14px;padding:13px 15px;border-radius:9px;line-height:1.7}.hint{background:#edf8f3;color:#315f4d}.empty{background:#f5f5f5;color:#777;text-align:center}.message{display:none;background:#fff2f0;color:#a33b31}.order-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.summary-cell{padding:14px;border-radius:10px;background:#f5faf8}.summary-cell small{display:block;margin-bottom:6px;color:#79847f}.items{display:grid;gap:12px;margin-top:18px}.item{display:grid;grid-template-columns:minmax(240px,1fr) 150px 120px;align-items:center;gap:16px;padding:16px;border:1px solid #dce7e2;border-radius:12px;cursor:pointer}.item:hover,.item.selected{border-color:#07c160;background:#f1fbf6}.item-name{font-weight:700}.item-meta{margin-top:5px;color:#748079;font-size:13px}.badge{justify-self:end;padding:6px 12px;border-radius:20px;background:#e4f7ed;color:#078443;white-space:nowrap}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:8px;padding:11px 24px;font-size:15px;cursor:pointer}button.primary{background:#07c160;color:#fff}button.secondary{background:#e9f7f0;color:#087a45}button:disabled{cursor:not-allowed;opacity:.55}.qr-header{margin-bottom:16px;line-height:1.8}.qr-list{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:16px}.qr-card{padding:14px;border:1px solid #d9e2de;border-radius:10px;text-align:center;break-inside:avoid}.qr-box{display:flex;justify-content:center;margin:10px auto}.qr-sn{font-weight:700}.qr-code-text{margin-top:7px;font-size:11px;word-break:break-all;color:#68736d}
    @media(max-width:760px){body{padding:12px}.order-summary{grid-template-columns:1fr}.item{grid-template-columns:1fr}.badge{justify-self:start}.qr-list{grid-template-columns:1fr}}
    @media print{@page{size:A4;margin:10mm}body{padding:0;background:#fff}body>.container>:not(#result-panel){display:none!important}#result-panel{box-shadow:none;padding:0;margin:0}#result-panel .actions{display:none!important}.qr-list{grid-template-columns:repeat(3,1fr);gap:7mm}.qr-card{border:1px solid #aaa;padding:4mm}}
  </style>
</head>
<body><main class="container">
  <header class="header"><h1>PLDP 产品生命周期二维码打印中心</h1></header>
  <section class="panel"><h2 class="panel-title">第一步：选择待打印订单</h2>
    <label for="order-select">订单计划（订单号｜商家｜厂家销售经理）</label><select id="order-select"><option value="">正在加载...</option></select>
    <div class="hint">仅显示已完成生产、且仍有产品型号未完成二维码打印的订单。</div><div id="message" class="message"></div>
    <div id="order-content" hidden><div class="order-summary">
      <div class="summary-cell"><small>订单计划</small><span id="plan-code"></span></div><div class="summary-cell"><small>商家</small><span id="merchant-name"></span></div><div class="summary-cell"><small>厂家销售经理</small><span id="sales-manager"></span></div>
    </div><h2 class="panel-title" style="margin-top:22px">第二步：选择本轮打印的产品型号</h2><div id="items" class="items"></div><div class="actions"><button id="generate-btn" class="primary" disabled>生成本型号全部二维码</button></div></div>
    <div id="empty" class="empty" hidden>当前没有待打印的订单。</div>
  </section>
  <section id="result-panel" class="panel" hidden><h2 class="panel-title">第三步：打印本型号二维码</h2><div id="qr-header" class="qr-header"></div><div id="qr-list" class="qr-list"></div><div class="actions"><button id="print-btn" class="primary">打印二维码</button><button id="confirm-btn" class="secondary">确认本型号已打印完成</button></div></section>
</main>
<script>
const DATA_URL="{% url 'pldp:web:print:data' %}",GENERATE_URL="{% url 'pldp:web:print:print_qrcode' %}",CONFIRM_URL="{% url 'pldp:web:print:print_confirm' %}";
const state={orders:[],order:null,item:null,result:null},$=id=>document.getElementById(id);
function cookie(name){const part=document.cookie.split("; ").find(row=>row.startsWith(name+"="));return part?decodeURIComponent(part.split("=").slice(1).join("=")):""}
async function api(url,options={}){const response=await fetch(url,{credentials:"same-origin",...options,headers:{"Content-Type":"application/json","X-CSRFToken":cookie("csrftoken"),...(options.headers||{})}}),payload=await response.json();if(!response.ok||payload.code!==0)throw new Error(payload.msg||"请求失败");return payload.data}
function showError(error){$("message").textContent=error.message||String(error);$("message").style.display="block"}function clearError(){$("message").style.display="none"}
function renderOrders(){const select=$("order-select");select.innerHTML='<option value="">请选择待打印订单</option>';state.orders.forEach(order=>{const option=document.createElement("option");option.value=order.id;option.textContent=`${order.plan_code}｜${order.merchant_name}｜${order.sales_manager_name}`;select.appendChild(option)});$("empty").hidden=state.orders.length>0;$("order-content").hidden=true;$("result-panel").hidden=true}
function renderOrder(){const order=state.order;$("order-content").hidden=!order;$("result-panel").hidden=true;state.item=null;$("generate-btn").disabled=true;if(!order)return;$("plan-code").textContent=order.plan_code;$("merchant-name").textContent=order.merchant_name;$("sales-manager").textContent=order.sales_manager_name;const list=$("items");list.innerHTML="";order.items.forEach(item=>{const node=document.createElement("div");node.className="item";node.innerHTML=`<div><div class="item-name">${item.product_model_name}</div><div class="item-meta">${item.category_name}｜${item.product_model_code}</div></div><div><strong>${item.quantity}</strong> 台<br><span class="item-meta">${item.order_batch_code}</span></div><span class="badge">${item.generated?"已生成·待打印":"待生成"}</span>`;node.onclick=()=>{document.querySelectorAll(".item").forEach(el=>el.classList.remove("selected"));node.classList.add("selected");state.item=item;$("generate-btn").disabled=false;$("generate-btn").textContent=item.generated?"重新显示本型号二维码":"生成本型号全部二维码"};list.appendChild(node)})}
function renderQRCodes(data){state.result=data;const item=data.item;$("qr-header").innerHTML=`<strong>${item.product_model_name}</strong>（${item.product_model_code}）<br>订单批次：${item.order_batch_code}｜本轮共 ${data.qrcodes.length} 张`;const list=$("qr-list");list.innerHTML="";data.qrcodes.forEach((entry,index)=>{const card=document.createElement("div");card.className="qr-card";card.innerHTML=`<div>${index+1} / ${data.qrcodes.length}</div><div class="qr-box"></div><div class="qr-sn">${entry.device_sn}</div><div class="qr-code-text">${entry.code}</div>`;list.appendChild(card);new QRCode(card.querySelector(".qr-box"),{text:entry.code,width:150,height:150})});$("result-panel").hidden=false;$("result-panel").scrollIntoView({behavior:"smooth"})}
async function load(){clearError();try{const data=await api(DATA_URL);state.orders=data.orders||[];state.order=null;renderOrders()}catch(error){showError(error)}}
$("order-select").onchange=event=>{state.order=state.orders.find(order=>String(order.id)===event.target.value)||null;renderOrder()};
$("generate-btn").onclick=async()=>{if(!state.item)return;clearError();$("generate-btn").disabled=true;try{renderQRCodes(await api(GENERATE_URL,{method:"POST",body:JSON.stringify({item_id:state.item.id})}))}catch(error){showError(error)}finally{$("generate-btn").disabled=false}};
$("print-btn").onclick=()=>window.print();
$("confirm-btn").onclick=async()=>{if(!state.result||!confirm("请确认本型号全部二维码已经实际打印完成。确认后，本型号将从待打印列表移除。"))return;$("confirm-btn").disabled=true;try{await api(CONFIRM_URL,{method:"POST",body:JSON.stringify({item_id:state.result.item.id})});alert("本型号打印完成，待打印列表已更新。全部型号完成后，该订单将自动消失。");await load()}catch(error){showError(error)}finally{$("confirm-btn").disabled=false}};load();
</script></body></html>
