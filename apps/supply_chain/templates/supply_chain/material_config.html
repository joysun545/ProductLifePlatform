.label{

    border-radius:6px;

}


.material-code-field{

    flex:1;

    display:flex;

<script>


// ==========================
// 全局
// ==========================


let materials = [];

let specs = [];

let suppliers = [];





// ==========================
// 页面初始化
// ==========================


window.onload = function(){


    loadMaterials();

    loadMaterialSpecs();

    loadSuppliers();

    loadMaterialList();

    loadSpecList();

    loadSupplierList();

    loadProductCategories();

};
        


function getCookie(name){

    let cookieValue = null;

    if(document.cookie){

        document.cookie.split(';').forEach(function(cookie){

            cookie = cookie.trim();

            if(cookie.startsWith(name + '=')){

                cookieValue = decodeURIComponent(
                    cookie.substring(name.length + 1)
                );

            }

        });

    }

    return cookieValue;
}
// ==========================


// ==========================
// TAB切换时恢复初始筛选状态
// ==========================


function resetMaterialFilter(){


    document.getElementById(
        "material_filter_category"
    ).value="";


    document.getElementById(
        "material_filter_keyword"
    ).value="";


    searchMaterialList();


}



function resetSpecFilter(){


    document.getElementById(
        "spec_filter_category"
    ).value="";


    document.getElementById(
        "spec_filter_material"
    ).value="";


    document.getElementById(
        "spec_filter_keyword"
    ).value="";


    loadSpecMaterials();

    loadSpecList();


}



function resetSupplierFilter(){


    document.getElementById(
        "supplier_filter_category"
    ).value="";


    document.getElementById(
        "supplier_filter_supplier"
    ).value="";


    document.getElementById(
        "supplier_filter_keyword"

// TAB切换
// ==========================


function switchTab(id,obj){


    document
    .querySelectorAll(".tab")
    .forEach(
        item=>{
            item.classList.remove("active");
        }
    );


    obj.classList.add("active");



    document
    .querySelectorAll(".panel")
    .forEach(
        item=>{
            item.classList.remove("active");
        }
    );



    document
    .getElementById(id)
    .classList.add("active");


    // 切换TAB时恢复初始筛选状态

    if(id=="material"){

        resetMaterialFilter();

    }


    if(id=="spec"){

        resetSpecFilter();

    }


    if(id=="supplier"){

        resetSupplierFilter();

    }


    // 切换主TAB时，默认回到添加页面

    if(id=="material"){

        showMaterialForm();

    }


    if(id=="spec"){

        showSpecForm();

    }


    if(id=="supplier"){

        showSupplierForm();

    }



    if(id=="spec"){

        loadMaterials();

        loadSpecList();

    }



    if(id=="supplier"){

        loadMaterialSpecs();

        loadSuppliers();

        loadSupplierList();

    }


}

function getSelectedMaterialCategoryCode(){


    const select =
    document.getElementById(
        "material_category"
    );


    if(!select || !select.value){

        return "";

    }


    const option =
    select.options[
        select.selectedIndex
    ];


    return (
        option.dataset.code || ""
    ).trim().toUpperCase();


}



function getMaterialCodePart(){


    const categoryCode =
    getSelectedMaterialCategoryCode();


    let codePart =
    document.getElementById(
        "material_code"
    ).value.trim().toUpperCase();


    const prefix =
    categoryCode
    ? categoryCode + "-"
    : "";


    if(
        prefix &&
        codePart.startsWith(prefix)
    ){

        codePart =
        codePart.substring(
            prefix.length
        ).trim();

    }


    return codePart;


}



function updateMaterialCodePreview(){


    const categoryCode =
    getSelectedMaterialCategoryCode();


    const codePart =
    getMaterialCodePart();


    const prefixNode =
    document.getElementById(
        "material_code_prefix"
    );


    const previewNode =
    document.getElementById(
        "material_code_preview"
    );


    prefixNode.textContent =
    categoryCode
    ? categoryCode + "-"
    : "品类编码-";


    if(!categoryCode){

        previewNode.textContent =
        "请先选择编码归属品类";

        return;

    }


    previewNode.textContent =
    codePart
    ? "最终保存编码：" + categoryCode + "-" + codePart
    : "最终保存编码：" + categoryCode + "-物料编码";


}



function normalizeMaterialCodeInput(){


    const input =
    document.getElementById(
        "material_code"
    );


    input.value =
    getMaterialCodePart();


    updateMaterialCodePreview();


}



function addMaterial(){


    let data={


        code:
        getMaterialCodePart(),


        name:
        document.getElementById(
            "material_name"
        ).value.trim(),


        product_category_id:
        document.getElementById(
            "material_category"
        ).value,

        product_category_ids: Array.from(
            document.querySelectorAll("#material_applicable_categories input:checked"),
            input => input.value
        ),


        is_key_part:
        document.getElementById(
            "material_key"
        ).checked,


        description:
        document.getElementById(
            "material_description"
        ).value.trim()


    };



    fetch(
        "/pldp/web/supply-chain/api/material/add/",
        {


            method:"POST",


            headers:{

                "Content-Type": "application/json",
                
                "X-CSRFToken":getCookie("csrftoken")

            },


            body:
            JSON.stringify(data)


        }
    )


    .then(res=>res.json())


    .then(data=>{


        if(data.success){


            showMessage(
                "物料添加成功：" + data.code
            );


            resetMaterial();

            loadMaterials();

            loadMaterialList();


        }

        else{


            showMessage(
                data.message ||

                false
            );


        }


    });



}

// ==========================
// 加载物料列表
// ==========================


function loadMaterialList(
    category="",
    keyword=""
){


    let url =
    "/pldp/web/supply-chain/api/materials/?category="
    + category
    + "&keyword="
    + encodeURIComponent(keyword);



    fetch(url)



    .then(
        res => res.json()
    )



    .then(
        data => {


            let html = "";



            if(
                !data ||
                data.length === 0
            ){

                document.getElementById(
                    "material_list"
                ).innerHTML =
                "暂无数据";


                return;

            }




            data.forEach(
                item => {



                    html += `

                    <div class="list-item">



                        <div class="list-content">



                            <b>

                            ${item.code}

                            -

                            ${item.name}

                            </b>




                            <div class="small">

                            产品分类：

                            ${
                                item.category
                                ?
                                item.category
                                :
                                "未分类"
                            }


                            </div>




                            <div class="small">


                            ${
                                item.is_key_part
                                ?
                                "关键件"
                                :
                                "普通件"
                            }


                            </div>



                            ${
                                item.description
                                ?
                                `
                                <div class="small">

                                ${item.description}

                                </div>
                                `
                                :
                                ""
                            }



                        </div>




                        <button

                        class="delete-btn"

                        onclick="
                        deleteMaterial(${item.id})
                        "

                        >

                        删除

                        </button>



                    </div>


                    `;


                }
            );




            document.getElementById(
                "material_list"
            ).innerHTML = html;



        }

    )



    .catch(
        error => {


            console.error(
                "物料列表加载失败:",
                error
            );


            document.getElementById(
                "material_list"
            ).innerHTML =
            "加载失败";


        }
    );


}

    ).value;

    document.getElementById(
        "supplier_filter_supplier"
    ).value = "";


    document.getElementById(
        "supplier_filter_keyword"
    ).value = "";


    loadSupplierList();



}


function loadProductCategories(){


    fetch(
        "/pldp/web/supply-chain/api/product-categories/"
    )


    .then(
        response => response.json()
    )


    .then(
        data => {


            let addSelect =
            document.getElementById(
                "material_category"
            );


            const applicableCategories = document.getElementById("material_applicable_categories");
            applicableCategories.replaceChildren();

            let filterSelect =
            document.getElementById(
                "material_filter_category"
            );


            let specSelect =
            document.getElementById(
                "spec_filter_category"
            );


            let supplierSelect =
            document.getElementById(
                "supplier_filter_category"
            );



            if(addSelect){

                addSelect.innerHTML =
                `
                <option value="">
                    请选择编码归属品类
                </option>
                `;

            }



            if(filterSelect){

                filterSelect.innerHTML =
                `
                <option value="">
                    全部产品分类
                </option>
                `;

            }



            if(specSelect){

                specSelect.innerHTML =
                `
                <option value="">
                    全部产品分类
                </option>
                `;

            }



            if(supplierSelect){

                supplierSelect.innerHTML =
                `
                <option value="">
                    全部产品分类
                </option>
                `;

            }



            data.forEach(
                item => {
                    const label = document.createElement("label");
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.className = "checkbox";
                    checkbox.value = item.id;
                    label.append(checkbox, document.createTextNode(item.name));
                    applicableCategories.appendChild(label);

                    if(addSelect){


                        let option1 =
                        document.createElement(
                            "option"
                        );


                        option1.value =
                        item.id;


                        option1.dataset.code =
                        item.code;


                        option1.textContent =
                        item.name;


                        addSelect.appendChild(
                            option1
                        );


                    }



                    if(filterSelect){


                        let option2 =
                        document.createElement(
                            "option"
                        );


                        option2.value =
                        item.id;


                        option2.textContent =
                        item.name;


                        filterSelect.appendChild(
                            option2
                        );


                    }



                    if(specSelect){


                        let option3 =
                        document.createElement(
                            "option"
                        );


                        option3.value =
                        item.id;


                        option3.textContent =
                        item.name;


                        specSelect.appendChild(
                            option3
                        );


                    }




                    if(supplierSelect){


                        let option4 =
                        document.createElement(
                            "option"
                        );


                        option4.value =
                        item.id;


                        option4.textContent =
                        item.name;


                        supplierSelect.appendChild(
                            option4
                        );


                    }


                }
            );


            updateMaterialCodePreview();


        }
    )


    .catch(
        error => {

            console.error(
                "产品分类加载失败:",
                error
            );

        }
    );


}






// ==========================
// 根据产品分类加载规格物料
// ==========================




function specCategoryChange(){


    document.getElementById(
        "spec_filter_keyword"
    ).value = "";


    loadSpecMaterials();


}


function loadSpecMaterials(){


    let category =
    document.getElementById(
        "spec_filter_category"
    ).value;



    let materialSelect =
    document.getElementById(
        "spec_filter_material"
    );



    if(!materialSelect){

        return;

    }



    materialSelect.innerHTML =
    `
    <option value="" onchange="loadSpecList()">
        全部物料
    </option>
    `;



    if(!category){

        loadSpecList();

        return;

    }



    fetch(
        "/pldp/web/supply-chain/api/materials-by-category/?category="
        + category
    )


    .then(
        response => response.json()
    )


    .then(
        data => {


            data.forEach(
                item => {


                    let option =
                    document.createElement(
                        "option"
                    );


                    option.value =
                    item.id;


                    option.textContent =
                    item.name;


                    materialSelect.appendChild(
                        option
                    );


                }
            );


            loadSpecList();


        }
    )


    .catch(
        error => {

            console.error(
                "加载规格物料失败:",
                error
            );

        }
    );


}





function materialCategoryChange(){


    document.getElementById(
        "material_filter_keyword"
    ).value = "";


    searchMaterialList();


}


function searchMaterialList(){


    let category =
    document.getElementById(
        "material_filter_category"
    ).value;



    let keyword =
    document.getElementById(
        "material_filter_keyword"
    ).value;



    loadMaterialList(
        category,
        keyword
    );


}
